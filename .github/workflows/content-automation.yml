name: Content automation (n8n)

on:
  repository_dispatch:
    types: [process-gallery]

# Queue gallery runs — do not cancel when Telegram sends multiple photos quickly.
concurrency:
  group: content-automation
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    # Share the pages queue with deploy.yml — never cancel mid-deploy (that caused gallery 404s).
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: git pull --rebase origin main

      - name: Install Pillow
        run: pip install Pillow

      - name: Process gallery images
        id: process
        run: |
          FILE="${{ github.event.client_payload.filename || '' }}"
          if [ -n "$FILE" ]; then
            python scripts/process-gallery.py --only "$FILE"
          else
            python scripts/process-gallery.py
          fi

      - name: Commit processed gallery
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/gallery.json
          git add assets/images/gallery/
          git add -u assets/images/gallery/_incoming/
          if git diff --staged --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No gallery changes to commit."
            exit 0
          fi
          git commit -m "chore: process gallery images from n8n"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin main
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 4))
          done
          echo "Push failed after retries"
          exit 1

      # GITHUB_TOKEN pushes do not trigger deploy.yml — deploy here, but only after
      # any previous Pages deployment has finished (avoids 400 "in progress deployment").
      - name: Wait for clear Pages deployment slot
        if: steps.commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 24; // ~8 minutes
            for (let i = 1; i <= maxAttempts; i++) {
              const deploys = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 5,
              });
              let blocked = false;
              for (const d of deploys.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: d.id,
                  per_page: 1,
                });
                const state = statuses.data[0]?.state || 'unknown';
                if (state === 'in_progress' || state === 'queued' || state === 'pending') {
                  blocked = true;
                  console.log(`Attempt ${i}: deployment ${d.id} is ${state}, waiting...`);
                  break;
                }
              }
              if (!blocked) {
                console.log('Pages deployment slot is clear.');
                return;
              }
              await new Promise((r) => setTimeout(r, 20000));
            }
            core.setFailed('Timed out waiting for an in-progress GitHub Pages deployment to finish.');

      - name: Setup Pages
        if: steps.commit.outputs.changes_detected == 'true'
        uses: actions/configure-pages@v5

      - name: Build site
        if: steps.commit.outputs.changes_detected == 'true'
        run: python scripts/publish.py

      - name: Upload artifact
        if: steps.commit.outputs.changes_detected == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for artifact
        if: steps.commit.outputs.changes_detected == 'true'
        run: sleep 20

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changes_detected == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15

      - name: Verify gallery is live
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://www.givsharifi.com/gallery/" || true)
            echo "Check $i: gallery HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Gallery did not return 200 after deploy"
          exit 1
